preprocessing:
  source: contracts/preprocessing_contract_v0.3.5.json
  status: FROZEN_BY_CONTENT_ADDRESS

weighting:
  config_path: configs/weighting_v0.3.5.yaml
  external_field_weight_map_required: true

model:
  family: tfidf-logistic-regression
  implementation_status: DIAGNOSTIC_BASELINE_REPRODUCTION
  feature_stack_order: [char_tfidf, word_tfidf]
  char_tfidf:
    analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    max_features: 110000
    sublinear_tf: true
    norm: l2
    dtype: float32
  word_tfidf:
    analyzer: word
    token_pattern: "(?u)\\b\\w+\\b"
    ngram_range: [1, 2]
    min_df: 2
    max_features: 30000
    sublinear_tf: true
    norm: l2
    dtype: float32
  scalar_logistic_regression:
    C: 3.0
    max_iter: 2000
    class_weight: balanced
    solver: saga
    random_state: 35
  reasoning_logistic_regression:
    C: 3.0
    max_iter: 1600
    class_weight: balanced
    solver: liblinear
    random_state: 35

calibration:
  method: reference-v0.3.5
  minimum_coverage: 0.80
  reasoning_threshold_grid: [0.15, 0.85, 0.05]
  ensure_at_least_one_reasoning_tag: true

baseline_reproduction:
  reference: baseline/semantic_baseline_metrics_v0.3.5.json
  tolerance: 1.0e-12

runtime:
  run_root: runs
  cpu_only: true
  immutable_runs: true

scope_guardrails:
  production_inference_49054_allowed: false
  encoder_training_allowed: false
  production_model_approval: false
