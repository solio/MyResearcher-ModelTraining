[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myresearcher-semantic-model"
version = "0.1.0"
description = "Reproducible and auditable local semantic-student diagnostic baseline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "joblib==1.5.2",
  "jsonschema==4.25.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]
encoder = [
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "real_data: read-only integration checks against the local upstream snapshot",
]

